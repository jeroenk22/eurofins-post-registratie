[build]
  command = "bash scripts/build.sh"
  publish = "dist"

[build.environment]
  VITE_APP_URL = "$DEPLOY_PRIME_URL"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  startTimeout = 60

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[edge_functions]]
  path     = "/*"
  function = "ip-guard"
